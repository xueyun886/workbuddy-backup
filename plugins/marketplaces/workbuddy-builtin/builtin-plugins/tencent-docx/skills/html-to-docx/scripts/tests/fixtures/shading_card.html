<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Shading Card Fixture (US6)</title></head>
<body>

<!-- Bare single-column table carrying multi-paragraph rich text with shading -->
<table class="abstract-card" style="background-color:#eef4fb;width:100%">
  <tr>
    <td style="background-color:#eef4fb;padding:12pt">
      <p><strong>核心观点</strong></p>
      <p>第一段：宏观判断与关键发现，整块底纹应铺满版心。</p>
      <p>第二段：补充论据，多段落富文本完整保留。</p>
    </td>
  </tr>
</table>

</body>
</html>
