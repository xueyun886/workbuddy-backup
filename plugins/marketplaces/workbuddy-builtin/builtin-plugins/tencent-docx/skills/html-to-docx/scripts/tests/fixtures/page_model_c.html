<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    @bottom-center { content: counter(page); }
    @top-right     { content: string(chapter); }
  }
  @page cover {
    @bottom-center { content: none; }
    @top-right     { content: none; }
  }
  section[role="cover"] { page: cover; }
  h1 { string-set: chapter content(text); }
</style>
</head>
<body>
  <section role="cover">
    <h1>封面标题</h1>
    <p>作者：示例</p>
  </section>
  <section role="body">
    <h1>第一章 引言</h1>
    <p>正文内容。</p>
    <h1>第二章 方法</h1>
    <p>正文内容。</p>
  </section>
</body>
</html>
