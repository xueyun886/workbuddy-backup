<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    @bottom-center { content: counter(page); }
  }
  @page cover {
    @bottom-center { content: none; }
  }
  section[role="cover"] { page: cover; }
</style>
</head>
<body>
  <section role="cover">
    <h1>封面标题</h1>
  </section>
  <section role="body" data-page-restart="1">
    <h1>第一章 引言</h1>
    <p>正文内容。</p>
  </section>
</body>
</html>
