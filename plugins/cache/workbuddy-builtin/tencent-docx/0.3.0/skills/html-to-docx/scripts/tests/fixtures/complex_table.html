<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Complex Table Test</title></head>
<body>

<table border="1">
  <caption>Table 2: Complex Spans Demo</caption>
  <thead>
    <tr>
      <th colspan="2">Merged Header (colspan=2)</th>
      <th>Header C</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">Merged Cell (rowspan=2)</td>
      <td>Row 1, Col B</td>
      <td>Row 1, Col C</td>
    </tr>
    <tr>
      <td>Row 2, Col B</td>
      <td>
        <ul>
          <li>Nested list item 1</li>
          <li>Nested list item 2</li>
        </ul>
      </td>
    </tr>
    <tr>
      <td style="width: 33%;">Row 3, Col A</td>
      <td style="width: 33%;">Row 3, Col B</td>
      <td style="width: 33%;">Row 3, Col C</td>
    </tr>
  </tbody>
</table>

</body>
</html>
